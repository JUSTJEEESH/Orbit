# XcodeGen project definition. Run `xcodegen generate` to (re)create Orbit.xcodeproj.
# Keeping the project file generated avoids merge conflicts and keeps source as the truth.

name: Orbit
options:
  bundleIdPrefix: com.orbit
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  xcodeVersion: "16.0"

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
  configs:
    Debug:
      baseConfig: Config/Debug.xcconfig
    Release:
      baseConfig: Config/Release.xcconfig

packages:
  OrbitWorkspace:
    path: .

schemes:
  Orbit:
    build:
      targets:
        Orbit: all
        OrbitShareExtension: [run, test, profile, analyze, archive]
        OrbitWidgets: [run, test, profile, analyze, archive]
    run:
      config: Debug
      storeKitConfiguration: Configuration.storekit
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  Orbit:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: App
    resources:
      - path: App/Resources
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: Orbit
        UILaunchScreen:
          UIColorName: launch.background
        NSMicrophoneUsageDescription: Orbit uses the microphone to capture voice notes you record.
        NSSpeechRecognitionUsageDescription: Orbit transcribes your voice notes on-device so they become searchable.
        NSPhotoLibraryUsageDescription: Orbit lets you save screenshots and photos as memories.
        NSCameraUsageDescription: Orbit lets you capture moments straight into your memory timeline.
        NSUserActivityTypes:
          - com.orbit.capture
        CFBundleURLTypes:
          - CFBundleURLName: com.orbit.app
            CFBundleURLSchemes:
              - orbit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orbit.app
        CODE_SIGN_ENTITLEMENTS: App/Resources/Orbit.entitlements
    dependencies:
      - package: OrbitWorkspace
        product: OrbitKit
      - package: OrbitWorkspace
        product: OrbitDesignSystem
      - package: OrbitWorkspace
        product: OrbitDomain
      - package: OrbitWorkspace
        product: OrbitPersistence
      - package: OrbitWorkspace
        product: OrbitMedia
      - package: OrbitWorkspace
        product: OrbitAI
      - package: OrbitWorkspace
        product: OrbitAccount
      - package: OrbitWorkspace
        product: OrbitStore
      - package: OrbitWorkspace
        product: OrbitHomeFeature
      - package: OrbitWorkspace
        product: OrbitTimelineFeature
      - package: OrbitWorkspace
        product: OrbitSearchFeature
      - package: OrbitWorkspace
        product: OrbitCaptureFeature
      - package: OrbitWorkspace
        product: OrbitSettingsFeature
      - package: OrbitWorkspace
        product: OrbitMemoryDetailFeature
      - package: OrbitWorkspace
        product: OrbitRecapFeature
      - target: OrbitShareExtension
        embed: true
      - target: OrbitWidgets
        embed: true

  OrbitShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Extensions/ShareExtension
    info:
      path: Extensions/ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Orbit
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orbit.app.share
        CODE_SIGN_ENTITLEMENTS: Extensions/ShareExtension/Orbit.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - package: OrbitWorkspace
        product: OrbitDomain
      - package: OrbitWorkspace
        product: OrbitPersistence

  OrbitWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Extensions/OrbitWidgets
    info:
      path: Extensions/OrbitWidgets/Info.plist
      properties:
        CFBundleDisplayName: Orbit
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orbit.app.widgets
        CODE_SIGN_ENTITLEMENTS: Extensions/OrbitWidgets/Orbit.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - package: OrbitWorkspace
        product: OrbitDesignSystem
      - package: OrbitWorkspace
        product: OrbitDomain
      - package: OrbitWorkspace
        product: OrbitPersistence
